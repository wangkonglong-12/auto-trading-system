[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "auto-trading-system"
version = "0.1.0.dev56"
description = "Windows QMT execution node for the tail-session quantitative trading system"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "APScheduler>=3.11,<3.12",
  "apsw==3.53.4.0",
  "cryptography>=46.0.5,<47",
  "fastapi>=0.127,<0.128",
  "httpx>=0.28,<0.29",
  "pydantic>=2.12,<2.13",
  "pydantic-settings>=2.11,<3",
  "pywin32==311; platform_system == 'Windows'",
  "tzdata>=2026.3,<2027; platform_system == 'Windows'",
  "uvicorn>=0.40,<0.41",
]

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "jsonschema[format]>=4.25,<5",
  "mypy>=1.18,<2",
  "pip-tools>=7.5,<8",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<0.15",
  "types-jsonschema>=4.25,<5",
]

[project.scripts]
auto-trading-node = "auto_trading_system.apps.node_process.__main__:main"
auto-trading-runtime = "auto_trading_system.apps.trade_runtime.__main__:main"
auto-trading-credential = "auto_trading_system.apps.credential_admin.__main__:main"
auto-trading-watchdog = "auto_trading_system.apps.watchdog.__main__:main"
auto-trading-qmt-probe = "auto_trading_system.apps.qmt_readonly_probe.__main__:main"
auto-trading-qmt-snapshot-probe = "auto_trading_system.apps.qmt_snapshot_probe.__main__:main"
auto-trading-qmt-tick-probe = "auto_trading_system.apps.qmt_tick_probe.__main__:main"
auto-trading-qmt-order-preflight = "auto_trading_system.apps.qmt_order_preflight.__main__:main"
auto-trading-qmt-command-probe = "auto_trading_system.apps.qmt_command_probe.__main__:main"
auto-trading-qmt-onboarding = "auto_trading_system.apps.qmt_onboarding.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_trading_system"]

[tool.hatch.build.targets.wheel.force-include]
"scripts/windows" = "auto_trading_system/deployment/windows"
"scripts/diagnose-environment.ps1" = "auto_trading_system/deployment/diagnose-environment.ps1"

[tool.hatch.build.targets.sdist]
exclude = [
  "/.codex_tmp",
  "/.coverage",
  "/dist",
  "/evidence",
  "/frontend/operator-console/coverage",
  "/frontend/operator-console/node_modules",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "C4", "DTZ", "E", "F", "I", "PERF", "RUF", "SIM", "UP"]
allowed-confusables = ["，", "；"]

[tool.ruff.lint.isort]
known-first-party = ["auto_trading_system"]

[tool.mypy]
python_version = "3.11"
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["win32api", "win32con", "win32event", "win32file", "win32pipe", "win32security", "win32job", "win32process", "pywintypes"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=auto_trading_system",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=90",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["auto_trading_system"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 2
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
